// ─── UI Atoms ───
function Field({label,children,style:s}){return<div style={{marginBottom:12,...s}}><div style={{fontSize:12,color:C.d,marginBottom:5,fontWeight:500}}>{label}</div>{children}</div>}
function Inp({value,onChange,placeholder,type="text",mono,style:s,...r}){return<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:C.t,fontSize:14,boxSizing:"border-box",fontFamily:mono?"'JetBrains Mono',monospace":"inherit",outline:"none",...s}} {...r}/>}
function Sel({value,onChange,options,placeholder}){return<select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:value?C.t:C.m,fontSize:14,boxSizing:"border-box",outline:"none"}}><option value="">{placeholder||"請選擇"}</option>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>}

function Card({children,style:s}){return<div style={{background:C.card,border:`1px solid ${C.bd}`,borderRadius:12,padding:16,...s}}>{children}</div>}

// ─── Firestore ───
function userDoc(uid,col){return db.collection("users").doc(uid).collection(col)}

function useFirestore(uid,colName,localKey,orderField="createdAt"){
  const[data,setData]=useState(()=>load(localKey,[]));
  const fromSnap=useRef(false);

  // Listen to Firestore realtime updates
  useEffect(()=>{
    if(!uid)return;
    const unsub=userDoc(uid,colName).orderBy(orderField,"desc").onSnapshot(snap=>{
      const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
      fromSnap.current=true;
      setData(docs);
      save(localKey,docs);
    },err=>console.error("Firestore listen error:",err));
    return()=>unsub();
  },[uid,colName]);

  const add=useCallback(async(item)=>{
    const{id,...rest}=item;
    if(!rest.createdAt)rest.createdAt=new Date().toISOString();
    await userDoc(uid,colName).doc(id).set(rest);
  },[uid,colName]);

  const update=useCallback(async(id,item)=>{
    const{id:_,...rest}=item;
    await userDoc(uid,colName).doc(id).update(rest);
  },[uid,colName]);

  const remove=useCallback(async(id)=>{
    await userDoc(uid,colName).doc(id).delete();
  },[uid,colName]);

  return{data,setData,add,update,remove,fromSnap};
}

// 批次刪除整個 collection（每批 400 筆，Firestore batch 上限 500）
async function wipeCollection(uid,colName,onProgress){
  let total=0;
  while(true){
    const snap=await userDoc(uid,colName).limit(400).get();
    if(snap.empty)break;
    const batch=db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    total+=snap.size;
    onProgress?.(total);
    if(snap.size<400)break;
  }
  return total;
}

// ═══════════════════════════════════════
// MAINTENANCE — 資料清除工具
// ═══════════════════════════════════════
const WIPE_COLS=[
  {col:"bets",localKey:"mlb-b4",label:"投注紀錄"},
  {col:"games",localKey:"mlb-g4",label:"賽果紀錄"}
];

function MaintenanceView({uid}){
  const[counts,setCounts]=useState(null);
  const[busy,setBusy]=useState(false);
  const[log,setLog]=useState([]);
  const addLog=m=>setLog(l=>[...l,m]);

  const refresh=useCallback(async()=>{
    setBusy(true);
    try{
      const out={};
      for(const c of WIPE_COLS){
        const snap=await userDoc(uid,c.col).get();
        out[c.col]=snap.size;
      }
      setCounts(out);
    }catch(e){addLog("讀取失敗："+e.message)}
    setBusy(false);
  },[uid]);

  useEffect(()=>{if(uid)refresh()},[uid,refresh]);

  const wipeAll=async()=>{
    const n=counts?Object.values(counts).reduce((a,b)=>a+b,0):0;
    if(!confirm(`確定刪除雲端全部 ${n} 筆資料？此動作無法復原。`))return;
    if(prompt("再次確認：請輸入 DELETE 以執行")!=="DELETE")return;
    setBusy(true);setLog([]);
    try{
      for(const c of WIPE_COLS){
        const d=await wipeCollection(uid,c.col,t=>addLog(`${c.label} 已刪除 ${t} 筆…`));
        addLog(`${c.label} 完成，共刪除 ${d} 筆`);
        localStorage.removeItem(c.localKey);
      }
      addLog("localStorage 快取已清除");
      addLog("全部完成");
    }catch(e){addLog("錯誤："+e.message)}
    setBusy(false);
    refresh();
  };

  return<div>
    <Card>
      <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>雲端資料</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {WIPE_COLS.map(c=><Stat key={c.col} label={c.label} value={counts?counts[c.col]:"…"} unit="筆"/>)}
      </div>
      <button onClick={refresh} disabled={busy} style={{marginTop:12,width:"100%",padding:"10px 0",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:C.d,fontSize:13,cursor:busy?"default":"pointer",outline:"none"}}>重新讀取</button>
    </Card>

    <Card style={{marginTop:12,borderColor:C.r}}>
      <div style={{fontSize:15,fontWeight:700,color:C.r,marginBottom:6}}>清除全部資料</div>
      <div style={{fontSize:12,color:C.d,lineHeight:1.7,marginBottom:12}}>
        刪除 users/&#123;uid&#125;/bets 與 users/&#123;uid&#125;/games 底下所有文件，並清掉本機 localStorage 快取。無法復原。
      </div>
      <button onClick={wipeAll} disabled={busy} style={{width:"100%",padding:"12px 0",borderRadius:8,border:`1px solid ${C.r}`,background:C.rD,color:C.r,fontSize:14,fontWeight:700,cursor:busy?"default":"pointer",outline:"none"}}>
        {busy?"處理中…":"清除全部雲端資料"}
      </button>
    </Card>

    {log.length>0&&<Card style={{marginTop:12}}>
      <div style={{fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.d,lineHeight:1.8}}>
        {log.map((l,i)=><div key={i}>{l}</div>)}
      </div>
    </Card>}
  </div>;
}

  return<div style={{background:C.bg,minHeight:"100vh",color:C.t,paddingBottom:80}}>
    <div style={{background:C.sf,borderBottom:`1px solid ${C.bd}`,padding:"14px 20px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:22}}>⚾</span>
      <div style={{flex:1}}><div style={{fontSize:17,fontWeight:700}}>MLB 投注追蹤</div><div style={{fontSize:11,color:C.d}}>台灣運彩 · 賽果分析</div></div>

    </div>

}
