// ─── Firestore ───
function userDoc(uid,col){return db.collection("users").doc(uid).collection(col)}

function useFirestore(uid,colName,localKey,orderField="createdAt"){
  const[data,setData]=useState(()=>load(localKey,[]));
  const fromSnap=useRef(false);
  useEffect(()=>{
    if(!uid)return;
    const unsub=userDoc(uid,colName).orderBy(orderField,"desc").onSnapshot(snap=>{
      const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
      fromSnap.current=true;
      setData(docs);
      save(localKey,docs);
    },err=>console.error("Firestore listen error:",err));
    return()=>unsub();
  },[uid,colName]);
  const add=useCallback(async(item)=>{
    const{id,...rest}=item;
    if(!rest.createdAt)rest.createdAt=new Date().toISOString();
    await userDoc(uid,colName).doc(id).set(rest);
  },[uid,colName]);
  const update=useCallback(async(id,item)=>{
    const{id:_,...rest}=item;
    await userDoc(uid,colName).doc(id).update(rest);
  },[uid,colName]);
  const remove=useCallback(async(id)=>{
    await userDoc(uid,colName).doc(id).delete();
  },[uid,colName]);
  return{data,setData,add,update,remove,fromSnap};
}

async function wipeCollection(uid,colName,onProgress){
  let total=0;
  while(true){
    const snap=await userDoc(uid,colName).limit(400).get();
    if(snap.empty)break;
    const batch=db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    total+=snap.size;
    onProgress?.(total);
    if(snap.size<400)break;
  }
  return total;
}

function useAnalysis(){
  const[data,setData]=useState(()=>load("mlb-analysis-v2",null));
  const[err,setErr]=useState(null);
  const[loading,setLoading]=useState(true);
  const reload=useCallback(()=>{
    setLoading(true);
    fetch("output/app_data.json?t="+Date.now())
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})

      .catch(e=>setErr(e.message))
      .finally(()=>setLoading(false));
  },[]);
  useEffect(()=>{reload()},[reload]);
  return{data,err,loading,reload};
}

function EdgeTag({edge}){

  const good=edge>=1.11;
  return<Tag color={good?C.g:edge>=1.05?C.acc:C.d} bg={good?C.gD:edge>=1.05?C.accD:"rgba(139,153,173,0.12)"}>
    edge {edge.toFixed(2)}</Tag>;
}

  const games=slate.games.filter(g=>!date||g.date===date);
  const picks=slate.picks.filter(p=>(!date||p.date===date)&&(p.edge||0)>=minEdge);
  return<div>
    <Card style={{marginBottom:12}}>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {slate.dates.map(d=><Pill key={d} small sel={date===d} onClick={()=>setDate(d)}>{d.slice(5)}</Pill>)}

      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
        <Muted>edge 門檻</Muted>
        {[1.0,1.05,1.11,1.2].map(v=><Pill key={v} small sel={minEdge===v} onClick={()=>setMinEdge(v)}>{v.toFixed(2)}</Pill>)}
      </div>
      <Muted style={{marginTop:10}}>
        引擎：{slate.engine}。<b style={{color:C.t}}>edge = 模型機率 ÷ 該玩法聯盟基準率</b>。
        台彩返還率約 {pctS(slate.payout,0)}，所以 edge 要大於 {(1/(slate.payout||0.9)).toFixed(2)} 才有正期望值 ——
        這是回測驗證過的排序方式，比單純看「機率高」可靠得多。
        「假設賠率」是用基準率推估台彩可能開的價位，實際請自行核對。

    </Card>

    <div style={{fontSize:13,fontWeight:700,margin:"14px 0 8px"}}>edge 排行（{picks.length}）</div>

        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:700,

      <Muted style={{marginBottom:8}}>訓練期挑出的高命中條件，到了測試期還剩多少 —— 這是最誠實的一張表。</Muted>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",fontSize:11}}>
          <thead><tr style={{color:C.d,textAlign:"left"}}>
            <th style={{padding:"4px 6px"}}>玩法</th><th>候選</th><th>訓練期</th><th>測試期</th><th>基準</th><th>仍≥75%</th>
          </tr></thead>
          <tbody>{c.oos.map((s,i)=><tr key={i} style={{borderTop:`1px solid ${C.bd}`}}>
            <td style={{padding:"4px 6px"}}>{s.market}</td>
            <td>{s.cands}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(s.mean_train,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:rateColor(s.mean_test)}}>{pctS(s.mean_test,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{pctS(s.base,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(s.hold75,0)}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>}
  </div>;
}

function SplitRow({label,d,cmp}){
  if(!d)return null;
  const diff=cmp&&d.woba!=null&&cmp.woba!=null?d.woba-cmp.woba:null;
  return<>
    <div style={{color:C.d}}>{label}</div>
    <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{numS(d.woba)}</div>
    <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{numS(d.xwoba_con)}</div>
    <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{d.k_pct==null?"—":d.k_pct+"%"}</div>
    <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{d.hardhit_pct==null?"—":d.hardhit_pct+"%"}</div>
    <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{d.pa}</div>

  </>;
}

function BacktestView({A}){
  const B=A.backtest;
  if(!B)return<Card><Muted>還沒有回測結果，跑 analysis/backtest.py。</Muted></Card>;
  const ts=B.two_stage;
  const need=1/(B.payout||0.9);
  return<div>
    <Card style={{marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>怎麼算 ROI 才不自欺</div>
      <Muted>
        沒有真實賠率，所以假設賠率 =（1 ÷ 該玩法基準命中率）× 返還率 {pctS(B.payout,0)}。
        例如「受讓 2.5」基準命中 73%，公正賠率 1.36，台彩大概開 1.22 ——
        所以命中率 80% 也只是打平。真正的門檻是
        <b style={{color:C.t}}> lift（命中率 ÷ 基準率）&gt; {need.toFixed(2)}</b>。
        <br/>樣本外期間：{B.oos_range[0]} ~ {B.oos_range[1]}
      </Muted>
    </Card>

    {ts&&ts.roi!=null&&<Card style={{marginBottom:12,borderColor:ts.roi>0?C.g:C.r}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>兩階段驗證（最誠實的一個數字）</div>
      <Muted style={{marginBottom:8}}>
        {ts.cut} 之前挑出 {ts.selected} 個「盤口 × 門檻」組合（lift ≥ {ts.min_lift}、樣本 ≥ {ts.min_n}），
        之後才真的下注。這樣連「挑策略」都沒偷看未來。
      </Muted>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <Stat label="測試期 ROI" value={(ts.roi>0?"+":"")+pctS(ts.roi,1)}
          color={ts.roi>0?C.g:C.r}/>
        <Stat label="下注數" value={ts.detail.reduce((a,b)=>a+b.test_n,0)} unit="注"/>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",fontSize:11}}>
          <thead><tr style={{color:C.d,textAlign:"left"}}>
            <th style={{padding:"4px 6px"}}>盤口</th><th>門檻</th><th>訓練lift</th>
            <th>測試注數</th><th>測試命中</th><th>ROI</th>
          </tr></thead>
          <tbody>{ts.detail.map((r,i)=><tr key={i} style={{borderTop:"1px solid "+C.bd}}>
            <td style={{padding:"4px 6px"}}>{r.market_zh}</td>
            <td>{pctS(r.thr,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{r.train_lift.toFixed(2)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{r.test_n}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(r.test_hit,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:r.test_roi>0?C.g:C.r}}>
              {r.test_roi>0?"+":""}{pctS(r.test_roi,0)}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>}

    <Card style={{marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>單注：依 lift 排序</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",fontSize:11}}>
          <thead><tr style={{color:C.d,textAlign:"left"}}>
            <th style={{padding:"4px 6px"}}>盤口</th><th>門檻</th><th>注數</th>
            <th>命中</th><th>基準</th><th>lift</th><th>假設賠率</th><th>ROI</th>
          </tr></thead>
          <tbody>{B.singles.slice(0,25).map((r,i)=><tr key={i} style={{borderTop:"1px solid "+C.bd}}>
            <td style={{padding:"4px 6px"}}>{r.market_zh}</td>
            <td>{pctS(r.thr,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{r.n}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(r.hit,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{pctS(r.base,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",
              color:r.lift>=need?C.g:C.d}}>{r.lift.toFixed(2)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{r.assumed_odds}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",
              color:r.roi[String(B.payout)]>0?C.g:C.r}}>
              {r.roi[String(B.payout)]>0?"+":""}{pctS(r.roi[String(B.payout)],0)}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>

    <Card>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>串關模擬（台彩玩法）</div>
      <Muted style={{marginBottom:8}}>
        每天挑 edge 最高的幾腳（同場只取一腳，符合台彩規則），組成 C(n,k) 張票。
      </Muted>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",fontSize:11}}>
          <thead><tr style={{color:C.d,textAlign:"left"}}>
            <th style={{padding:"4px 6px"}}>策略</th><th>天數</th><th>單腳命中</th><th>票命中</th><th>ROI</th>
          </tr></thead>
          <tbody>{Object.entries(B.parlays).map(([k,v])=><tr key={k} style={{borderTop:"1px solid "+C.bd}}>
            <td style={{padding:"4px 6px"}}>{k}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{v.days}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(v.leg_hit_rate,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{pctS(v.ticket_hit_rate,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:v.roi>0?C.g:C.r}}>
              {v.roi>0?"+":""}{pctS(v.roi,0)}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>
  </div>;
}

function usePlayerSplits(){
  const[d,setD]=useState(null);
  const[e,setE]=useState(null);
  useEffect(()=>{
    fetch("output/player_splits.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
      .then(setD).catch(x=>setE(x.message));
  },[]);
  return{d,e};
}

function PlayerRow({name,meta,splits,keys}){
  const[open,setOpen]=useState(false);
  const all=splits.all||{};
  return<div style={{padding:"7px 0",borderTop:"1px solid "+C.bd}}>
    <div onClick={()=>setOpen(!open)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",gap:8}}>
      <div style={{minWidth:0}}>
        <div style={{fontSize:12,fontWeight:600}}>{name}</div>
        <Muted>{meta}</Muted>
      </div>
      <div style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace"}}>
        <div style={{fontSize:13,fontWeight:700}}>{numS(all.woba)}</div>
        <Muted>{all.pa} PA</Muted>
      </div>
    </div>
    {open&&<div style={{marginTop:6,display:"grid",gridTemplateColumns:"auto repeat(5,auto)",gap:"3px 8px",fontSize:11}}>
      <div style={{color:C.m}}></div><div style={{color:C.m}}>wOBA</div><div style={{color:C.m}}>xwOBA</div>
      <div style={{color:C.m}}>K%</div><div style={{color:C.m}}>揮空%</div><div style={{color:C.m}}>PA</div>
      {keys.filter(k=>splits[k]).map(k=><React.Fragment key={k}>
        <div style={{color:C.d}}>{k}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{numS(splits[k].woba)}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{numS(splits[k].xwoba)}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{splits[k].k==null?"—":splits[k].k+"%"}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{splits[k].whiff==null?"—":splits[k].whiff+"%"}</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{splits[k].pa}</div>
      </React.Fragment>)}
    </div>}
  </div>;
}

  return<div>
    <Card style={{marginBottom:12}}>
      <Field label="選擇球隊" style={{marginBottom:10}}>

      <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>得分期望值模型（主引擎）</div>
      <Muted style={{marginBottom:8}}>
        先預測雙方得分 μ，再用負二項分布（過度分散 α={R.alpha_full.toFixed(3)}）展開、卷積，
        一次算出所有盤口且互相一致。樣本外單邊得分 MAE {R.mae.full}（只押平均是 {R.mae.full_baseline}）。
      </Muted>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",fontSize:11}}>
          <thead><tr style={{color:C.d,textAlign:"left"}}>
            <th style={{padding:"4px 6px"}}>盤口</th><th>AUC</th><th>Brier技巧</th><th>基準</th><th>最高機率</th>
          </tr></thead>
          <tbody>{R.markets.slice(0,14).map((m,i)=><tr key={i} style={{borderTop:"1px solid "+C.bd}}>
            <td style={{padding:"4px 6px"}}>{m.market}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:m.auc>=0.55?C.g:C.d}}>{m.auc.toFixed(3)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:m.brier_skill>0?C.g:C.r}}>
              {m.brier_skill>0?"+":""}{m.brier_skill.toFixed(3)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{pctS(m.base,0)}</td>
            <td style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{pctS(m.p_max,0)}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>}
    <Muted style={{margin:"0 0 10px"}}>以下是「每個盤口各自訓練一個分類器」的舊做法，留著對照。</Muted>
    <Card style={{marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>模型層在做什麼</div>
      <Muted>
        每半個月用「當時之前的所有比賽」重新訓練一次梯度提升模型，只預測訓練期之後的比賽，
        所以下面每一個數字都是樣本外。<b style={{color:C.t}}>AUC</b> 0.5 = 沒資訊；
        <b style={{color:C.t}}>Brier 技巧</b> &gt;0 = 比一律押基準率更好；
        <b style={{color:C.t}}>≥70%/≥75% 格</b>= 模型喊到那麼高機率時，實際命中率是多少。
      </Muted>
    </Card>
    {A.models.map(m=>{
      const t70=m.thresholds.find(t=>t.thr===0.7);
      const t75=m.thresholds.find(t=>t.thr===0.75);
      const useful=m.auc>=0.55&&m.brier_skill>0;
      return<Card key={m.market} style={{marginBottom:8,padding:13}}>
        <div onClick={()=>setOpen(open===m.market?null:m.market)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",gap:8}}>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>{m.market_zh}</div>
            <Muted style={{marginTop:3}}>樣本外 {m.oos_n} 場・基準 {pctS(m.base,0)}・最高機率 {pctS(m.p_max,0)}</Muted>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:16,fontWeight:700,
              color:useful?C.g:C.d}}>{m.auc.toFixed(3)}</div>
            <Muted>Brier {m.brier_skill>0?"+":""}{m.brier_skill.toFixed(3)}</Muted>
          </div>
        </div>
        <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
          {t70&&<Tag color={rateColor(t70.rate)} bg="rgba(139,153,173,0.12)">≥70% 時 {pctS(t70.rate,0)}（{t70.n} 場）</Tag>}
          {t75&&<Tag color={rateColor(t75.rate)} bg="rgba(139,153,173,0.12)">≥75% 時 {pctS(t75.rate,0)}（{t75.n} 場）</Tag>}
          {!useful&&<Tag color={C.r} bg={C.rD}>資訊量不足</Tag>}
        </div>
        {open===m.market&&<div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.bd}`}}>
          <Muted style={{fontWeight:700,color:C.t,marginBottom:6}}>校準表（預測 vs 實際）</Muted>
          <div style={{display:"grid",gridTemplateColumns:"auto auto auto auto",gap:"3px 10px",fontSize:11}}>
            <div style={{color:C.m}}>機率區間</div><div style={{color:C.m}}>場數</div>
            <div style={{color:C.m}}>預測</div><div style={{color:C.m}}>實際</div>
            {m.calibration.map((c,i)=><React.Fragment key={i}>
              <div style={{color:C.d}}>{c.bucket}</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace"}}>{c.n}</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",color:C.m}}>{pctS(c.pred,0)}</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",color:rateColor(c.actual)}}>{pctS(c.actual,0)}</div>
            </React.Fragment>)}
          </div>
        </div>}
      </Card>;
    })}
    {A.importance&&Object.keys(A.importance).length>0&&<Card style={{marginTop:12}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>哪些分項特徵真的有用</div>
      <Muted style={{marginBottom:8}}>permutation importance：打亂該特徵後樣本外 AUC 掉多少。</Muted>
      {Object.entries(A.importance).map(([mk,feats])=><div key={mk} style={{marginBottom:10}}>
        <Muted style={{color:C.t,fontWeight:700}}>{mk}</Muted>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:4}}>
          {feats.slice(0,10).map((f,i)=><Tag key={i}>{f.feature} {f.auc_drop>0?"+":""}{f.auc_drop.toFixed(3)}</Tag>)}
        </div>
      </div>)}
    </Card>}
  </div>;
}

// ═══════════════════════════════════════
// 分析主頁
// ═══════════════════════════════════════
function AnalysisView({A,err,loading,reload}){
  const[sub,setSub]=useState("slate");
  if(!A)return<Card>
    <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>還沒有分析資料</div>
    <Muted>{loading?"載入中…":err?`讀取 output/app_data.json 失敗：${err}`:"請先跑 analysis/run_all.py"}</Muted>
    <button onClick={reload} style={{marginTop:10,padding:"8px 14px",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:C.d,fontSize:12,cursor:"pointer"}}>重新載入</button>
  </Card>;
  const subs=[["slate","推薦"],["bt","回測"],["cond","條件"],["teams","球隊"],["players","球員"],["models","模型"]];
  return<div>
    <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}}>
      {subs.map(([k,l])=><Pill key={k} small sel={sub===k} onClick={()=>setSub(k)}>{l}</Pill>)}
    </div>
    <Muted style={{marginBottom:10}}>
      資料：2026 球季 ~ {A.data.through}・{A.data.games} 場・{A.data.pitches.toLocaleString()} 球 Statcast
      ・產生於 {A.generated}
    </Muted>
    {sub==="slate"&&<SlateView A={A}/>}
    {sub==="bt"&&<BacktestView A={A}/>}
    {sub==="players"&&<PlayersView A={A}/>}
    {sub==="cond"&&<ConditionsView A={A}/>}
    {sub==="teams"&&<TeamsView A={A}/>}
    {sub==="models"&&<ModelsView A={A}/>}
  </div>;
}

// ═══════════════════════════════════════
// 首頁
// ═══════════════════════════════════════
function HomeView({A,goto}){
  const nA=A?.conditions?.tierA?.length;
  const picks=A?.slate?.picks||[];
  const strong=picks.filter(p=>(p.edge||0)>=1.11);
  const bt=A?.backtest?.two_stage;
  return<div>
    <Card style={{textAlign:"center",padding:"28px 16px"}}>
      <div style={{fontSize:36,marginBottom:8}}>⚾</div>
      <div style={{fontSize:20,fontWeight:700}}>MLB 2026 資料分析</div>
      <Muted style={{marginTop:6}}>
        {A?`${A.data.games} 場完賽・${A.data.pitches.toLocaleString()} 球 Statcast 逐球資料`:"尚未載入分析資料"}
      </Muted>
    </Card>
    {A&&<>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}>
        <Stat label="Tier A 條件" value={nA} unit="組" color={nA>0?C.g:C.d}/>
        <Stat label="檢定假設數" value={(A.conditions.hypotheses/1e6).toFixed(1)+"M"}/>
        <Stat label="模型可用玩法" value={A.models.filter(m=>m.auc>=0.55&&m.brier_skill>0).length} unit={`/${A.models.length}`}/>
        <Stat label="待開打強訊號" value={strong.length} unit="個" color={strong.length?C.acc:C.d}/>
        {bt&&bt.roi!=null&&<Stat label="兩階段驗證 ROI"
          value={(bt.roi>0?"+":"")+pctS(bt.roi,1)} color={bt.roi>0?C.g:C.r}/>}
      </div>
      <Card style={{marginTop:12}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>今晚看什麼</div>
        {strong.length===0&&<Muted>目前沒有 edge ≥ 1.11（達到正期望值門檻）的訊號。</Muted>}
        {strong.slice(0,6).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"6px 0",borderTop:i?`1px solid ${C.bd}`:"none"}}>
          <div style={{fontSize:12,minWidth:0}}>
            <div style={{fontWeight:600}}>{p.matchup}</div>
            <Muted>{p.date.slice(5)}・{p.market_zh}{p.team?"（"+p.team+"）":""}</Muted>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:C.g}}>{pctS(p.p)}</div>
            <Muted>edge {p.edge?.toFixed(2)}</Muted>
          </div>
        </div>)}
        <button onClick={()=>goto("analysis")} style={{marginTop:10,width:"100%",padding:"9px 0",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:C.acc,fontSize:12,fontWeight:600,cursor:"pointer"}}>看完整分析</button>
      </Card>
    </>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}>
      <Stat label="台北日期" value={todayStr()}/>
      <Stat label="美西日期" value={todayPT()}/>
    </div>
  </div>;
}

// ═══════════════════════════════════════
// 維護
// ═══════════════════════════════════════
const WIPE_COLS=[
  {col:"bets",localKey:"mlb-b4",label:"投注紀錄"},
  {col:"games",localKey:"mlb-g4",label:"賽果紀錄"}
];

function MaintenanceView({uid}){
  const[counts,setCounts]=useState(null);
  const[busy,setBusy]=useState(false);
  const[log,setLog]=useState([]);
  const addLog=m=>setLog(l=>[...l,m]);

  const refresh=useCallback(async()=>{
    setBusy(true);
    try{
      const out={};
      for(const c of WIPE_COLS){
        const snap=await userDoc(uid,c.col).get();
        out[c.col]=snap.size;
      }
      setCounts(out);
    }catch(e){addLog("讀取失敗："+e.message)}
    setBusy(false);
  },[uid]);

  useEffect(()=>{if(uid)refresh()},[uid,refresh]);

  const wipeAll=async()=>{
    const n=counts?Object.values(counts).reduce((a,b)=>a+b,0):0;
    if(!confirm(`確定刪除雲端全部 ${n} 筆資料？此動作無法復原。`))return;
    if(prompt("再次確認：請輸入 DELETE 以執行")!=="DELETE")return;
    setBusy(true);setLog([]);
    try{
      for(const c of WIPE_COLS){
        const d=await wipeCollection(uid,c.col,t=>addLog(`${c.label} 已刪除 ${t} 筆…`));
        addLog(`${c.label} 完成，共刪除 ${d} 筆`);
        localStorage.removeItem(c.localKey);
      }
      addLog("localStorage 快取已清除");
      addLog("全部完成");
    }catch(e){addLog("錯誤："+e.message)}
    setBusy(false);
    refresh();
  };

  return<div>
    <Card>
      <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>雲端資料</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {WIPE_COLS.map(c=><Stat key={c.col} label={c.label} value={counts?counts[c.col]:"…"} unit="筆"/>)}
      </div>
      <button onClick={refresh} disabled={busy} style={{marginTop:12,width:"100%",padding:"10px 0",borderRadius:8,border:`1px solid ${C.bd}`,background:C.bg,color:C.d,fontSize:13,cursor:busy?"default":"pointer",outline:"none"}}>重新讀取</button>
    </Card>

    <Card style={{marginTop:12,borderColor:C.r}}>
      <div style={{fontSize:15,fontWeight:700,color:C.r,marginBottom:6}}>清除全部資料</div>
      <Muted style={{marginBottom:12}}>
        刪除 users/&#123;uid&#125;/bets 與 users/&#123;uid&#125;/games 底下所有文件，並清掉本機 localStorage 快取。無法復原。
      </Muted>
      <button onClick={wipeAll} disabled={busy} style={{width:"100%",padding:"12px 0",borderRadius:8,border:`1px solid ${C.r}`,background:C.rD,color:C.r,fontSize:14,fontWeight:700,cursor:busy?"default":"pointer",outline:"none"}}>
        {busy?"處理中…":"清除全部雲端資料"}
      </button>
    </Card>

    {log.length>0&&<Card style={{marginTop:12}}>
      <div style={{fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:C.d,lineHeight:1.8}}>
        {log.map((l,i)=><div key={i}>{l}</div>)}
      </div>
    </Card>}
  </div>;
}

// ═══════════════════════════════════════
// APP
// ═══════════════════════════════════════
function App(){
  const[user,setUser]=useState(undefined);
  const[tab,setTab]=useState("home");
  const{data:A,err,loading,reload}=useAnalysis();

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(u=>setUser(u||null));
    return()=>unsub();
  },[]);

  const uid=user?.uid;
  const signIn=()=>auth.signInWithPopup(googleProvider).catch(e=>{
    if(e.code==="auth/popup-blocked"||e.code==="auth/cancelled-popup-request")auth.signInWithRedirect(googleProvider);
    else alert("登入失敗："+e.message);
  });
  const signOut=()=>auth.signOut();

  if(user===undefined)return<div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.d}}>
    <div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>⚾</div><div>載入中...</div></div>
  </div>;

  if(!user)return<div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.t}}>
    <div style={{textAlign:"center",padding:40}}>
      <div style={{fontSize:60,marginBottom:16}}>⚾</div>
      <div style={{fontSize:22,fontWeight:700,marginBottom:6}}>MLB 投注追蹤</div>
      <div style={{fontSize:13,color:C.d,marginBottom:32}}>台灣運彩 · 賽果分析</div>
      <button onClick={signIn} style={{padding:"12px 32px",borderRadius:10,border:`1px solid ${C.bd}`,background:C.card,color:C.t,fontSize:15,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:10,margin:"0 auto",outline:"none"}}>
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 019.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 000 24c0 3.77.9 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
        使用 Google 登入
      </button>
      <div style={{fontSize:11,color:C.m,marginTop:16}}>登入後資料自動跨裝置同步</div>
    </div>
  </div>;

  const tabs=[
    {id:"home",icon:"⚾",label:"首頁"},
    {id:"analysis",icon:"🔬",label:"分析"},
    {id:"maint",icon:"🧹",label:"維護"},
  ];

  return<div style={{background:C.bg,minHeight:"100vh",color:C.t,paddingBottom:80}}>
    <div style={{background:C.sf,borderBottom:`1px solid ${C.bd}`,padding:"14px 20px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:22}}>⚾</span>
      <div style={{flex:1}}><div style={{fontSize:17,fontWeight:700}}>MLB 投注追蹤</div><div style={{fontSize:11,color:C.d}}>台灣運彩 · 資料分析</div></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {user.photoURL&&<img src={user.photoURL} style={{width:24,height:24,borderRadius:"50%"}} referrerPolicy="no-referrer"/>}
        <button onClick={signOut} style={{background:"none",border:"none",color:C.d,cursor:"pointer",fontSize:11}}>登出</button>
      </div>
    </div>
    <div style={{maxWidth:560,margin:"0 auto",padding:"12px 16px"}}>
      {tab==="home"&&<HomeView A={A} goto={setTab}/>}
      {tab==="analysis"&&<AnalysisView A={A} err={err} loading={loading} reload={reload}/>}
      {tab==="maint"&&<MaintenanceView uid={uid}/>}
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.sf,borderTop:`1px solid ${C.bd}`,display:"flex",zIndex:10}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0 8px",background:"none",border:"none",cursor:"pointer",color:tab===t.id?C.acc:C.d,display:"flex",flexDirection:"column",alignItems:"center",gap:2,borderTop:tab===t.id?`2px solid ${C.acc}`:"2px solid transparent",outline:"none"}}>
        <span style={{fontSize:18}}>{t.icon}</span><span style={{fontSize:11,fontWeight:tab===t.id?700:400}}>{t.label}</span>
      </button>)}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
